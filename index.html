<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Dépôt Pharmaceutique Lilbouré</title>
<style>
:root{--bg:#f4f7f6;--cd:#fff;--tx:#14211d;--mu:#62736d;--pr:#0f7a5c;--bd:#dce5e1;--rd:#c62f2f;--or:#c77a0a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1715;--cd:#18231f;--tx:#e6efec;--mu:#93a59e;--pr:#2fc79a;--bd:#2a3a35;--rd:#ff6b6b;--or:#f0a53a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:0 0 80px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:#000;border-bottom:3px solid var(--pr);color:#fff;position:sticky;top:0;z-index:5}
.st{font-size:12px;background:rgba(255,255,255,.2);padding:6px 10px;border-radius:12px;border:0;color:#fff}
main{padding:14px;max-width:720px;margin:auto}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.k{font-size:20px;font-weight:700}.m{color:var(--mu);font-size:13px}.bad{color:var(--rd)}.warn{color:var(--or)}.ok{color:var(--pr)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 1px;font-size:10px}nav button.on{color:var(--pr);font-weight:700}nav span{display:block;font-size:18px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
.b{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--pr);color:#fff;font-size:16px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid currentColor}
h3{margin:14px 0 8px;font-size:16px}.msg{padding:10px;border-radius:8px;margin-bottom:10px;background:var(--bd);font-size:14px}.red{background:var(--rd)!important}
</style></head><body>
<header><div style="display:flex;align-items:center;gap:8px"><img src="logo.png" alt="Lilbouré" style="height:50px"><small id="rl" data-a="out" style="cursor:pointer"></small></div><button class="st" id="sync"></button></header>
<main id="v"></main><nav id="nav"></nav>
<script type="module">
import {firebaseConfig as C} from './config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,reauthenticateWithCredential,EmailAuthProvider,updatePassword} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,updateDoc,writeBatch,onSnapshot,query,orderBy,where,limit} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID(),iso=()=>new Date().toISOString(),today=()=>iso().slice(0,10);
const fmt=n=>Math.round(n).toLocaleString('fr-FR')+' FCFA',days=e=>Math.ceil((new Date(e)-new Date(today()))/864e5);
const nz=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=initializeApp(C),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
let U=null,ops=[],users=[],D={prods:[],lots:[],sales:[],agg:{total:0,byV:{},byP:{},sc:0,mg:0}},tab='sale',msg='',pend=false,PD=null,setting=false,setupMode=false,unsubs=[],prof=null,B=null,opsUn=null,cart=[];
const adm=()=>U&&U.role=='admin',email=l=>l.toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@lilboure.app';
const P=id=>D.prods.find(p=>p.pid==id),stockOf=id=>D.lots.filter(l=>l.pid==id&&l.exp>=today()&&l.qty>0).reduce((a,l)=>a+l.qty,0);
const who=s=>(users.find(u=>u.id==s.by)||{}).name||s.byName;
const kk=n=>String(n).replace(/[.\/\[\]*`~]/g,'_');
function derive(ops,B){const Pm={},del=new Set(),L={},used={},sales=[];
if(B){B.prods.forEach(p=>Pm[p.pid]=p);B.lots.forEach(l=>L[l.lid]=l)}
for(const o of ops){if(o.type=='PRODUCT'){if(!Pm[o.pid]||Pm[o.pid].t<o.t)Pm[o.pid]=o}else if(o.type=='PDEL')del.add(o.pid);else if(o.type=='LOT')L[o.lid]=o;else if(o.type=='SALE'){sales.push(o);o.uses.forEach(u=>used[u.l]=(used[u.l]||0)+u.q)}}
const ag=B&&B.agg?JSON.parse(JSON.stringify(B.agg)):{total:0,byV:{},byP:{}};ag.sc=ag.sc||0;ag.mg=ag.mg||0;
const S2=sales.map(o=>{let c=0,ok=1;o.uses.forEach(u=>{const l=L[u.l];if(l&&typeof l.cost=='number')c+=u.q*l.cost;else ok=0});return{...o,mg:ok?o.total-c:null}});
S2.forEach(s=>{if(s.mg!=null){ag.sc+=s.total;ag.mg+=s.mg}ag.total+=s.total;const n=kk(who(s)),p=kk(s.pname);ag.byV[n]=(ag.byV[n]||0)+s.total;ag.byP[p]=(ag.byP[p]||0)+s.total});
return{prods:Object.values(Pm).filter(p=>!del.has(p.pid)).sort((a,b)=>a.name.localeCompare(b.name)),lots:Object.values(L).filter(l=>!del.has(l.pid)).map(l=>({...l,qty:l.qty-(used[l.lid]||0)})),sales:S2.reverse(),agg:ag}}
function alerts(){const a=[];D.prods.forEach(p=>{const s=stockOf(p.pid);if(!s)a.push({lv:3,t:`Rupture : ${p.name}`});else if(s<=p.min)a.push({lv:2,t:`Stock critique : ${p.name} (${s} ≤ ${p.min})`})});
D.lots.filter(l=>l.qty>0).forEach(l=>{const d=days(l.exp),n=(P(l.pid)||{}).name;if(d<0)a.push({lv:3,t:`PÉRIMÉ : ${n} lot ${l.no} (${l.qty} u.) – à mettre en quarantaine`});else if(d<=30)a.push({lv:3,t:`Péremption < 30 j : ${n} lot ${l.no} (${d} j)`});else if(d<=90)a.push({lv:2,t:`Péremption < 90 j : ${n} lot ${l.no} (${d} j)`})});return a.sort((x,y)=>y.lv-x.lv)}
function emit(o){o={id:uid(),t:iso(),by:U.id,byName:U.name,...o};try{setDoc(doc(db,'ops',o.id),o).catch(e=>{msg='⛔ Refusé : '+(e.code||e.message);render()})}catch(e){msg='⛔ Erreur : '+e.message;render()}}
const k=(l,v,c='')=>`<div class="c"><div class="m">${l}</div><div class="k ${c}">${v}</div></div>`,opts=()=>D.prods.map(p=>`<option value="${p.pid}">${esc(p.name)}</option>`).join('');
const optsS=q=>{q=nz(q.trim());return D.prods.filter(p=>nz(p.name).includes(q)).map(p=>`<option value="${p.pid}">${esc(p.name)} — stock ${stockOf(p.pid)}</option>`).join('')};
const al=a=>a.map(x=>`<div class="c row"><span>${x.t}</span><span class="tag ${x.lv==3?'bad':'warn'}">${x.lv==3?'Urgent':'Attention'}</span></div>`).join('')||'<div class="c ok">Aucune alerte ✔</div>';
const sl=a=>a.slice(0,6).map(s=>`<div class="c row"><span>${esc(s.pname)} ×${s.q}<div class="m">${esc(who(s))} · ${new Date(s.t).toLocaleString('fr-FR')}${s.ord?' · ord. '+s.ord.slice(-4):''}</div></span><b>${fmt(s.total)}</b></div>`).join('')||'<div class="m">Aucune vente</div>';
const V={
dash(){const a=alerts(),ca=D.sales.filter(s=>s.t.slice(0,10)==today()).reduce((x,s)=>x+s.total,0),val=D.lots.filter(l=>l.exp>=today()&&l.qty>0).reduce((x,l)=>x+l.qty*((P(l.pid)||{}).price||0),0);
return`<div class="g">${k('Valeur du stock',fmt(val))}${k('CA du jour',fmt(ca))}${k('Alertes',a.length,a.length?'bad':'ok')}${k('Vendeurs actifs',users.filter(u=>u.active&&u.role!='admin').length)}${k('Marge du jour',fmt(D.sales.filter(s=>s.t.slice(0,10)==today()&&s.mg!=null).reduce((x,s)=>x+s.mg,0)))}${k('Marge totale',fmt(D.agg.mg)+(D.agg.sc?' ('+Math.round(D.agg.mg/D.agg.sc*100)+' %)':''),'ok')}</div><h3>Alertes prioritaires</h3>${al(a.slice(0,4))}<h3>Dernières ventes</h3>${sl(D.sales)}`},
stock(){const lots=p=>D.lots.filter(l=>l.pid==p.pid&&l.qty>0).sort((a,b)=>a.exp.localeCompare(b.exp)).map(l=>{const d=days(l.exp);return`<div class="row m"><span>Lot ${esc(l.no)} · ${l.qty} u.</span><span class="${d<0?'bad':d<=90?'warn':''}">${d<0?'périmé':l.exp}</span></div>`}).join('');
const card=p=>{const s=stockOf(p.pid),c=!s?'bad':s<=p.min?'warn':'ok';return`<div class="c"><div class="row"><b>${esc(p.name)}</b><span class="k ${c}">${s}</span></div><div class="m">${fmt(p.price)}/u. · seuil ${p.min}</div>${lots(p)}`+(adm()?`<label>Nom</label><input data-f="name" data-i="${p.pid}" value="${esc(p.name)}"><div class="g"><div><label>Prix (FCFA)</label><input type="number" min="0" data-f="price" data-i="${p.pid}" value="${p.price}"></div><div><label>Seuil min.</label><input type="number" min="0" data-f="min" data-i="${p.pid}" value="${p.min}"></div></div><button class="st red" style="margin-top:8px" data-a="del" data-i="${p.pid}">Supprimer</button>`:'')+`</div>`};
return(adm()?`<div class="c"><b>➕ Ajouter un produit</b><label>Nom</label><input id="np"><div class="g"><div><label>Prix (FCFA)</label><input id="npr" type="number" min="0"></div><div><label>Seuil min.</label><input id="nmn" type="number" min="0" value="20"></div></div><button class="b" data-a="addp">Ajouter</button></div><div class="c"><b>Importer un catalogue</b><div class="m">CSV : nom;prix;seuil</div><input type="file" id="fi" accept=".csv,.txt"></div>`:'')+D.prods.map(card).join('')+(adm()&&D.prods.length?`<button class="b red" data-a="delall">Vider tout le catalogue</button>`:'')},
recep(){return`<div class="c"><b>Réception de marchandise</b><label>Produit</label><select id="rp">${opts()}</select><label>N° de lot</label><input id="rlot"><label>Péremption</label><input id="re" type="date"><label>Quantité</label><input id="rq" type="number" min="1"><label>Coût d'achat unitaire (FCFA)</label><input id="rcost" type="number" min="0"><button class="b" data-a="recv">Enregistrer l'entrée</button></div>`},
sale(){const my=adm()?D.sales:D.sales.filter(s=>s.by==U.id);return`<div class="c"><b>Ordonnance ou vente (FEFO automatique)</b><label>Produit</label><input id="ss" type="search" placeholder="🔍 Rechercher un produit..." autocomplete="off"><select id="sp" style="margin-top:8px">${optsS('')}</select><label>Quantité</label><input id="sq" type="number" min="1" value="1"><button class="b" data-a="addc">Ajouter à l'ordonnance</button><button class="b" style="background:var(--mu)" data-a="sell1">Vendre ce produit seul</button></div>${cart.length?`<div class="c"><b>Ordonnance en cours</b>${cart.map((x,i)=>{const p=P(x.pid);return`<div class="row" style="margin-top:6px"><span>${esc(p.name)} ×${x.q}<div class="m">${fmt(x.q*p.price)}</div></span><button class="st red" data-a="rmc" data-i="${i}">Retirer</button></div>`}).join('')}<div class="row" style="margin-top:10px"><b>Total</b><b>${fmt(cart.reduce((a,x)=>a+x.q*P(x.pid).price,0))}</b></div><button class="b" data-a="sell">Valider l'ordonnance</button></div>`:''}<h3>${adm()?'Dernières ventes':'Mes dernières ventes'}</h3>${sl(my)}`},
alert(){return al(alerts())},
rep(){const g=D.agg,loss=D.lots.filter(l=>l.exp<today()&&l.qty>0).reduce((a,l)=>a+l.qty*((P(l.pid)||{}).price||0),0);
const li=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="c row"><span>${esc(n)}</span><b>${fmt(v)}</b></div>`).join('')||'<div class="m">Aucune vente</div>';
return`${k('CA total',fmt(g.total))}${k('Pertes dues aux péremptions',fmt(loss),'bad')}<h3>Ventes par vendeur</h3>${li(g.byV)}<h3>Ventes par produit</h3>${li(g.byP)}<h3>Exports et clôture</h3><button class="b" data-a="exs">Exporter les ventes (CSV)</button><div class="m">Ventes depuis la dernière clôture, heure UTC.</div><button class="b" data-a="exst">Exporter le stock (CSV)</button><button class="b" data-a="pdfv">Ventes en PDF</button><button class="b" data-a="pdfs">Stock en PDF</button><button class="b" data-a="pdfr">Synthèse en PDF</button><div class="m">Dans la fenêtre d'impression, choisissez « Enregistrer au format PDF ».</div><div class="c" style="margin-top:14px"><b>Clôture mensuelle</b><div class="m">Dernière clôture : ${B?new Date(B.t).toLocaleDateString('fr-FR'):'aucune'} · ${ops.length} opérations chargées à chaque ouverture.</div><div class="m">Archive tout ce qui précède le 1er du mois en cours. Exportez d'abord et connectez tous les téléphones. Possible à partir du 5 du mois.</div><button class="b red" data-a="close">Clôturer jusqu'au 1er du mois</button></div><div class="c" style="border:2px solid var(--rd)"><b>Remise à zéro</b><div class="m">Efface produits, stocks et ventes de l'application pour repartir de zéro. Les comptes sont conservés. Les anciennes données restent archivées dans Firebase mais ne sont plus affichées. Exportez d'abord et connectez tous les téléphones.</div><button class="b red" data-a="reset">Remettre tout à zéro</button></div>`},
acct(){return`<div class="c"><b>🔑 Changer mon mot de passe</b><label>Mot de passe actuel</label><input id="pw0" type="password" autocomplete="current-password"><label>Nouveau mot de passe (6 caractères min.)</label><input id="pw1" type="password" autocomplete="new-password"><label>Répéter le nouveau mot de passe</label><input id="pw2" type="password" autocomplete="new-password"><button class="b" data-a="chpw">Modifier</button></div>${adm()?'<div class="m">Mot de passe oublié par un vendeur : désactivez son accès (onglet Équipe) puis créez-en un nouveau avec un autre identifiant.</div>':''}`},
team(){return users.filter(u=>!u.hidden).map(u=>`<div class="c"><div class="row"><b>${esc(u.name)}</b><span class="tag ${u.active?'ok':'bad'}">${u.role=='admin'?'Admin':'Vendeur'}${u.active?'':' · désactivé'}</span></div><div class="m">Identifiant : ${esc(u.login||'')}</div><label>Nom</label><input data-u="${u.id}" value="${esc(u.name)}">${u.id!=U.id&&u.active?`<button class="st red" style="margin-top:8px" data-a="udel" data-i="${u.id}">Désactiver l'accès</button>`:u.id!=U.id?`<button class="st red" style="margin-top:8px" data-a="uhide" data-i="${u.id}">Retirer de la liste</button>`:''}</div>`).join('')+`<div class="c"><b>➕ Ajouter une personne</b><label>Nom</label><input id="un"><label>Identifiant (sans espace)</label><input id="ul" autocapitalize="none"><label>Mot de passe (6 caractères min.)</label><input id="up" type="password"><label>Rôle</label><select id="ur"><option value="vendeur">Vendeur</option><option value="admin">Administrateur</option></select><button class="b" data-a="addu">Créer l'accès</button></div>`}};
const loginV=()=>setupMode?`<div class="c"><b>Première installation</b><div class="m">Créez le compte administrateur (une seule fois).</div><label>Votre nom</label><input id="sn"><label>Identifiant</label><input id="li" autocapitalize="none"><label>Mot de passe (6 caractères min.)</label><input id="lw" type="password"><button class="b" data-a="setup">Créer le compte</button><button class="st red" style="margin-top:10px" data-a="sm">Retour</button></div>`:`<div class="c"><b>🔒 Connexion</b><label>Identifiant</label><input id="li" autocapitalize="none"><label>Mot de passe</label><input id="lw" type="password"><button class="b" data-a="login">Entrer</button><button class="st" style="margin-top:12px;background:var(--mu)" data-a="sm">Première installation ?</button></div>`;
const pwBox=()=>`<div class="c" style="border:2px solid var(--rd)"><b>🔐 Confirmation requise</b><div class="m">Saisissez votre mot de passe pour confirmer (connexion nécessaire).</div><input id="dp" type="password" autocomplete="new-password">${PD&&PD.k=='reset'?'<label>Tapez ZERO pour confirmer la remise à zéro</label><input id="dz" autocomplete="off">':''}<div class="g"><button class="b red" data-a="cdel">Confirmer</button><button class="b" style="background:var(--mu)" data-a="cx">Annuler</button></div></div>`;
function st(){$('sync').textContent=(navigator.onLine?'🟢 En ligne':'🔴 Hors ligne')+(pend?' · envoi en attente':'')}
function render(){st();$('rl').textContent=U?`${U.name} (${adm()?'Admin':'Vendeur'}) ⎋`:'';
if(!U){$('v').innerHTML=(msg?`<div class="msg">${msg}</div>`:'')+loginV();$('nav').innerHTML='';return}
const T=[['dash','📊','Bord'],['stock','📦','Stock'],['recep','⬇️','Entrée'],['sale','🛒','Vente'],['alert','🔔','Alertes'],['rep','📈','Rapports'],['team','👥','Équipe'],['acct','🔑','Compte']].filter(t=>adm()||['sale','stock','alert','acct'].includes(t[0]));
if(!T.find(t=>t[0]==tab))tab=T[0][0];
$('nav').innerHTML=T.map(t=>`<button class="${tab==t[0]?'on':''}" data-a="go" data-i="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
$('v').innerHTML=(PD?pwBox():'')+(msg?`<div class="msg">${msg}</div>`:'')+V[tab]()}
const idle=()=>{const e=document.activeElement;if(e&&/INPUT|SELECT/.test(e.tagName))st();else render()};
function listenOps(){if(opsUn)opsUn();const c=collection(db,'ops'),q=B?query(c,where('t','>',B.t),orderBy('t')):query(c,orderBy('t'));
opsUn=onSnapshot(q,s=>{ops=s.docs.map(d=>d.data());pend=s.metadata.hasPendingWrites;D=derive(ops,B);idle()},e=>{msg='⛔ '+e.code;idle()})}
function listen(){unsubs.forEach(f=>f());unsubs=[];let first=true;
unsubs.push(onSnapshot(query(collection(db,'closures'),orderBy('t','desc'),limit(1)),s=>{const nb=s.docs.length?s.docs[0].data():null;if(!first&&(nb&&nb.t)===(B&&B.t))return;first=false;B=nb;listenOps()},e=>{msg='⛔ '+e.code;idle()}));
if(adm())unsubs.push(onSnapshot(collection(db,'users'),s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));idle()}))}
onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];if(opsUn){opsUn();opsUn=null}B=null;if(prof)prof();U=null;cart=[];if(!u)return render();
prof=onSnapshot(doc(db,'users',u.uid),s=>{if(!s.exists()){if(!setting){msg='Compte non autorisé.';signOut(auth)}return}const d=s.data();if(!d.active){msg='Compte désactivé.';signOut(auth);return}
const first=!U;U={id:u.uid,...d};if(first){tab=adm()?'dash':'sale';msg='';listen()}render()})});
function pdf(title,sub,heads,rows,foot){const h=`<!doctype html><html lang="fr"><meta charset="utf-8"><title>${esc(title)}</title><style>body{font:12px Arial,sans-serif;color:#111;margin:18px}header{display:flex;align-items:center;gap:12px;border-bottom:3px solid #0f7a5c;padding-bottom:8px;margin-bottom:12px}header img{height:56px;background:#000}h1{font-size:18px;margin:0}small{color:#555}table{width:100%;border-collapse:collapse}th,td{border:1px solid #bbb;padding:4px 6px;text-align:left}th{background:#e6f2ee}.n{text-align:right}tr{page-break-inside:avoid}tfoot td{font-weight:bold;background:#f2f2f2}</style><header><img src="${new URL('logo.png',location.href).href}"><div><h1>${esc(title)}</h1><small>Dépôt Pharmaceutique Lilbouré · ${esc(sub)} · édité le ${new Date().toLocaleString('fr-FR')}</small></div></header><table><thead><tr>${heads.map(x=>`<th${x[1]?' class="n"':''}>${esc(x[0])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${heads[i][1]?' class="n"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>${foot?`<tfoot><tr><td colspan="${heads.length}">${esc(foot)}</td></tr></tfoot>`:''}</table>`;
const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);f.onload=()=>setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),60000)},500);f.srcdoc=h}
const cut=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).toISOString()};
function dl(name,rows){const t='\ufeff'+rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function alloc(pid,q,tk){let r=q;const u=[];for(const l of D.lots.filter(l=>l.pid==pid&&l.exp>=today()&&l.qty>0).sort((a,b)=>a.exp.localeCompare(b.exp))){const t=Math.min(l.qty-(tk[l.lid]||0),r);if(t<=0)continue;u.push({l:l.lid,q:t,no:l.no});r-=t;if(!r)break}if(r)return null;u.forEach(x=>tk[x.l]=(tk[x.l]||0)+x.q);return u}
function commit(lines){const tk={},out=[],oid=uid();
for(const x of lines){const p=P(x.pid);if(!p||!p.price&&p.price!==0){msg='⚠️ Produit introuvable.';return false}const u=alloc(x.pid,x.q,tk);if(!u){msg='⛔ Stock valide insuffisant pour '+p.name+' (lots périmés exclus). Rien n\'a été enregistré.';return false}out.push({pid:x.pid,pname:p.name,q:x.q,total:x.q*p.price,uses:u})}
out.forEach(o=>emit({type:'SALE',ord:oid,...o}));
msg=out.length>1?'✔ Ordonnance validée : '+out.length+' produits, total '+fmt(out.reduce((a,o)=>a+o.total,0)):'✔ Vente validée. Lots : '+out[0].uses.map(u=>u.no+'×'+u.q).join(', ');return true}

await setDoc(doc(db,'closures',uid()),{t:c,by:U.id,byName:U.name,made:iso(),prods:X.prods.map(p=>({pid:p.pid,name:p.name,min:p.min,price:p.price,t:c})),lots:X.lots.filter(l=>l.qty>0).map(l=>({lid:l.lid,pid:l.pid,no:l.no,exp:l.exp,qty:l.qty,t:c,cost:typeof l.cost=='number'?l.cost:null})),agg:X.agg})}

pdfv(){pdf('Rapport des ventes','Ventes depuis la dernière clôture',[['Date'],['Produit'],['Quantité',1],['Total',1],['Vendeur'],['Marge',1]],D.sales.map(s=>[new Date(s.t).toLocaleString('fr-FR'),s.pname,s.q,fmt(s.total),who(s),s.mg==null?'—':fmt(s.mg)]),D.sales.length+' vente(s) · Total '+fmt(D.sales.reduce((a,s)=>a+s.total,0)))},
pdfs(){const v=D.lots.filter(l=>l.exp>=today()&&l.qty>0).reduce((a,l)=>a+l.qty*((P(l.pid)||{}).price||0),0);pdf('État du stock','Au '+new Date().toLocaleDateString('fr-FR'),[['Produit'],['Prix',1],['Seuil',1],['Stock valide',1],['Lots (quantité, péremption)']],D.prods.map(p=>[p.name,fmt(p.price),p.min,stockOf(p.pid),D.lots.filter(l=>l.pid==p.pid&&l.qty>0).map(l=>l.no+' ('+l.qty+', '+l.exp+')').join(' ; ')]),'Valeur du stock valide : '+fmt(v))},

recv(){const q=+$('rq').value,no=$('rlot').value.trim(),e=$('re').value;const cs=$('rcost').value;if(!$('rp').value||!no||!e||q<1||cs===''){msg='⚠️ Remplissez tous les champs.';return render()}emit({type:'LOT',lid:uid(),pid:$('rp').value,no,exp:e,qty:q,cost:+cs});msg=`✔ Entrée enregistrée (${q} u., lot ${no})`;render()},
addc(){const pid=$('sp').value,q=+$('sq').value,p=P(pid);if(!p){msg='⚠️ Choisissez un produit.';return render()}if(!(q>=1))return;
const ex=cart.find(x=>x.pid==pid),tot=(ex?ex.q:0)+q;if(stockOf(pid)<tot){msg='⛔ Stock insuffisant pour '+p.name+' : '+stockOf(pid)+' disponible(s).';return render()}
if(ex)ex.q=tot;else cart.push({pid,q});msg='';render()},
rmc(i){cart.splice(+i,1);render()},
sell(){if(!cart.length){msg='⚠️ Ajoutez d\'abord des produits à l\'ordonnance.';return render()}if(commit(cart))cart=[];render()},
sell1(){const pid=$('sp').value,q=+$('sq').value;if(!P(pid)){msg='⚠️ Choisissez un produit.';return render()}if(!(q>=1))return;commit([{pid,q}]);render()},
addp(){const n=$('np').value.trim(),pr=+$('npr').value;if(!n||!(pr>0)){msg='⚠️ Indiquez un nom et un prix.';return render()}if(D.prods.some(p=>nz(p.name)==nz(n))){msg='⚠️ Ce produit existe déjà.';return render()}
emit({type:'PRODUCT',pid:uid(),name:n,min:+$('nmn').value||0,price:pr});msg='✔ Produit ajouté. Enregistrez son stock dans « Entrée ».';render()},

try{await reauthenticateWithCredential(auth.currentUser,EmailAuthProvider.credential(auth.currentUser.email,$('dp').value))}catch(e){msg='⛔ Mot de passe incorrect (ou pas de connexion).';return render()}
const d=PD;PD=null;if(d.k=='p')emit({type:'PDEL',pid:d.i});else if(d.k=='all')D.prods.forEach(p=>emit({type:'PDEL',pid:p.pid}));else if(d.k=='close'){try{await doClose();msg='✔ Clôture effectuée. Exportez régulièrement vos données.'}catch(e){msg='⛔ '+(e.code||e.message)}render();return}else if(d.k=='reset'){try{await doReset();msg='✔ Remise à zéro effectuée.'}catch(e){msg='⛔ '+(e.code||e.message)}render();return}else if(d.k=='uh')updateDoc(doc(db,'users',d.i),{hidden:true});else updateDoc(doc(db,'users',d.i),{active:false});msg='✔ Supprimé.';render()},
async addu(){const n=$('un').value.trim(),l=$('ul').value.trim(),w=$('up').value;if(!n||!l||w.length<6){msg='⚠️ Nom, identifiant et mot de passe (6 min.) requis.';return render()}

else if(t.id=='fi'&&t.files[0]){const r=new FileReader();r.onload=()=>{let n=0;r.result.split(/\r?\n/).forEach(l=>{const[a,b,c]=l.split(';'),pr=+b;if(!a||!pr)return;const x=D.prods.find(p=>nz(p.name)==nz(a.trim()));emit({type:'PRODUCT',pid:x?x.pid:uid(),name:x?x.name:a.trim(),min:+c||(x?x.min:20),price:pr});n++});msg=`✔ ${n} produit(s) importé(s)`;render()};r.readAsText(t.files[0])}});
